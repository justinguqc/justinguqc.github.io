<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc"><title id="title">Observed approaches to AI code</title><desc id="desc">Two direct adopters, three structural reviewers, and one deep investigator were observed during the same To-do List practice activity.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52636b" stroke-width="1.5"/></marker></defs><rect width="1000" height="370" rx="12" fill="#f8fafb"/><style>text{font-family:Arial,sans-serif;fill:#233039}.mono{font-family:Consolas,monospace}.muted{fill:#5b6870}</style><text x="35" y="42" font-size="18" font-weight="bold" class="" text-anchor="start">ONE PRACTICE TASK. THREE REVIEW APPROACHES.</text><rect x="35" y="72" width="286" height="236" rx="8" fill="#fff" stroke="#c6d0d5" stroke-width="1.5"/><text x="54" y="105" font-size="15" font-weight="bold" class="muted" text-anchor="start">O1 · 2 students</text><text x="54" y="147" font-size="21" font-weight="bold" class="" text-anchor="start">Direct adoption</text><text x="54" y="187" font-size="16" font-weight="normal" class="" text-anchor="start">Copy and paste AI output</text><text x="54" y="214" font-size="16" font-weight="normal" class="" text-anchor="start">without attending to details</text><line x1="54" y1="238" x2="300" y2="238" stroke="#dde3e6"/><text x="54" y="271" font-size="14" font-weight="normal" class="" text-anchor="start">Need: purpose and visible effects</text><rect x="357" y="72" width="286" height="236" rx="8" fill="#fff" stroke="#c6d0d5" stroke-width="1.5"/><text x="376" y="105" font-size="15" font-weight="bold" class="muted" text-anchor="start">O2 · 3 students</text><text x="376" y="147" font-size="21" font-weight="bold" class="" text-anchor="start">Structural review</text><text x="376" y="187" font-size="16" font-weight="normal" class="" text-anchor="start">Understand files or functions</text><text x="376" y="214" font-size="16" font-weight="normal" class="" text-anchor="start">but struggle with local details</text><line x1="376" y1="238" x2="622" y2="238" stroke="#dde3e6"/><text x="376" y="271" font-size="14" font-weight="normal" class="" text-anchor="start">Need: connect lines to behaviour</text><rect x="679" y="72" width="286" height="236" rx="8" fill="#fff" stroke="#c6d0d5" stroke-width="1.5"/><text x="698" y="105" font-size="15" font-weight="bold" class="muted" text-anchor="start">O3 · 1 student</text><text x="698" y="147" font-size="21" font-weight="bold" class="" text-anchor="start">Deep investigation</text><text x="698" y="187" font-size="16" font-weight="normal" class="" text-anchor="start">Study individual lines</text><text x="698" y="214" font-size="16" font-weight="normal" class="" text-anchor="start">and invest additional time</text><line x1="698" y1="238" x2="944" y2="238" stroke="#dde3e6"/><text x="698" y="271" font-size="14" font-weight="normal" class="" text-anchor="start">Need: depth and relevant context</text><text x="35" y="344" font-size="15" font-weight="normal" class="muted" text-anchor="start">Observation synthesis · qualitative patterns, not measured outcomes</text></svg>