<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AITrace: Prototype</title>
    <style>
      html {
        scroll-padding-top: 1rem;
      }
      body {
        max-width: 900px;
        margin: 32px auto;
        padding: 0 24px;
        color: #242424;
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.65;
        overflow-wrap: break-word;
      }
      a {
        color: #0969da;
        text-underline-offset: 2px;
      }
      .topbar .container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 24px;
        font-size: 14px;
      }
      .navlinks {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 24px;
      }
      .brand {
        color: inherit;
        font-weight: 600;
      }
      .hero {
        margin: 40px 0 32px;
      }
      .eyebrow, .byline {
        color: #666;
        font-size: 14px;
      }
      h1, h2, h3 {
        line-height: 1.3;
      }
      h1 {
        margin: 12px 0;
        font-size: 2em;
      }
      h2 {
        margin: 40px 0 20px;
        padding-bottom: 8px;
        border-bottom: 1px solid #ddd;
        font-size: 1.5em;
      }
      h3 {
        margin: 28px 0 12px;
        font-size: 1.15em;
      }
      p, ul, ol {
        margin: 0 0 16px;
      }
      ul, ol {
        padding-left: 28px;
      }
      li + li {
        margin-top: 6px;
      }
      .observation-counts {
        margin: 0 0 16px;
      }
      .observation-counts span {
        display: inline-block;
        margin-right: 16px;
      }
      .table-wrap {
        overflow-x: auto;
        margin: 20px 0 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        line-height: 1.5;
      }
      th, td {
        border: 1px solid #d8d8d8;
        padding: 8px 12px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #f6f6f6;
      }
      figure {
        margin: 24px 0;
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
      }
      figcaption, .caption {
        margin-top: 8px;
        color: #666;
        font-size: 14px;
      }
      code {
        padding: 2px 4px;
        background: #f4f4f4;
        font-family: Consolas, monospace;
        font-size: 0.9em;
      }
      .footer {
        margin-top: 40px;
        padding-top: 16px;
        border-top: 1px solid #ddd;
        color: #666;
        font-size: 13px;
      }
      @media (max-width: 600px) {
        body {
          margin: 20px auto;
          padding: 0 16px;
        }
        th, td {
          min-width: 120px;
        }
      }
      @media print {
        body {
          max-width: none;
          margin: 0;
          padding: 0;
          font-size: 11pt;
        }
        .table-wrap {
          overflow: visible;
        }
        h1, h2, h3 {
          break-after: avoid;
        }
        figure, tr {
          break-inside: avoid;
        }
      }
    </style>
  </head>
