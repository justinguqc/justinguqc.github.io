<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">AITrace prototype architecture</title><desc id="desc">Prepared case data feeds a change model. The code view and explanation panel synchronize through change identifiers. Decisions update review state, preview, and undo. Questions retrieve prepared answers.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52636b" stroke-width="1.5"/></marker></defs><rect width="1000" height="720" rx="12" fill="#f8fafb"/><style>text{font-family:Arial,sans-serif;fill:#233039}.mono{font-family:Consolas,monospace}.muted{fill:#5b6870}</style><rect x="22" y="22" width="956" height="674" rx="8" fill="#f8fafb" stroke="#c6d0d5" stroke-width="1.5" stroke-dasharray="7 5"/><text x="45" y="55" font-size="17" font-weight="bold" class="" text-anchor="start">EXISTING HOST: STUDENT COMPUTER + WEB BROWSER</text><rect x="330" y="82" width="340" height="90" rx="8" fill="#fff" stroke="#c6d0d5" stroke-width="1.5"/><text x="500.0" y="110" font-size="18" font-weight="bold" class="" text-anchor="middle">Prepared case data</text><text x="500.0" y="134" font-size="14" font-weight="normal" class="muted" text-anchor="middle">Original code, edits, dependencies,</text><text x="500.0" y="156" font-size="14" font-weight="normal" class="muted" text-anchor="middle">explanations, examples, answers</text><path d="M500 172 V201" fill="none" stroke="#52636b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="330" y="205" width="340" height="74" rx="8" fill="#fff" stroke="#c6d0d5" stroke-width="1.5"/><text x="500.0" y="233" font-size="18" font-weight="bold" class="" text-anchor="middle">Change model</text><text x="500.0" y="257" font-size="14" font-weight="normal" class="muted" text-anchor="middle">Stable identifiers and selected unit</text><path d="M425 279 V300 H235 V321" fill="none" stroke="#52636b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M575 279 V300 H765 V321" fill="none" stroke="#52636b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="65" y="325" width="340" height="96" rx="8" fill="#fff" stroke="#c6d0d5" stroke-width="1.5"/><text x="235.0" y="353" font-size="18" font-weight="bold" class="" text-anchor="middle">Code comparison view</text><text x="235.0" y="377" font-size="14" font-weight="normal" class="muted" text-anchor="middle">Existing code-display component</text><text x="235.0" y="399" font-size="14" font-weight="normal" class="muted" text-anchor="middle">+ custom selection and highlights</text><rect x="595" y="325" width="340" height="96" rx="8" fill="#fff" stroke="#c6d0d5" stroke-width="1.5"/><text x="765.0" y="353" font-size="18" font-weight="bold" class="" text-anchor="middle">Explanation panel</text><text x="765.0" y="377" font-size="14" font-weight="normal" class="muted" text-anchor="middle">Summary, detail, contextual questions</text><text x="765.0" y="399" font-size="14" font-weight="normal" class="muted" text-anchor="middle">+ anchored comments</text><path d="M405 371 H588" fill="none" stroke="#52636b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M595 394 H412" fill="none" stroke="#52636b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="500" y="351" font-size="14" font-weight="normal" class="muted" text-anchor="middle">Selected ID</text><path d="M235 421 V451" fill="none" stroke="#52636b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M685 421 V438 H330 V451" fill="none" stroke="#52636b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="65" y="455" width="340" height="78" rx="8" fill="#fff" stroke="#c6d0d5" stroke-width="1.5"/><text x="235.0" y="483" font-size="18" font-weight="bold" class="" text-anchor="middle">Review state</text><text x="235.0" y="507" font-size="14" font-weight="normal" class="muted" text-anchor="middle">Pending / accepted / rejected</text><path d="M765 421 V451" fill="none" stroke="#52636b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="595" y="455" width="340" height="78" rx="8" fill="#fff" stroke="#c6d0d5" stroke-width="1.5"/><text x="765.0" y="483" font-size="18" font-weight="bold" class="" text-anchor="middle">Question context</text><text x="765.0" y="507" font-size="14" font-weight="normal" class="muted" text-anchor="middle">Prepared answer for selected unit</text><path d="M935 494 H953 V375 H940" fill="none" stroke="#52636b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M235 533 V563" fill="none" stroke="#52636b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="65" y="567" width="340" height="95" rx="8" fill="#fff" stroke="#c6d0d5" stroke-width="1.5"/><text x="235.0" y="595" font-size="18" font-weight="bold" class="" text-anchor="middle">Change application + preview</text><text x="235.0" y="619" font-size="14" font-weight="normal" class="muted" text-anchor="middle">Combine compatible accepted edits</text><text x="235.0" y="641" font-size="14" font-weight="normal" class="muted" text-anchor="middle">with the original code</text><rect x="595" y="567" width="340" height="95" rx="8" fill="#fff" stroke="#c6d0d5" stroke-width="1.5"/><text x="765.0" y="595" font-size="18" font-weight="bold" class="" text-anchor="middle">Undo history</text><text x="765.0" y="619" font-size="14" font-weight="normal" class="muted" text-anchor="middle">Restore an earlier review state</text><path d="M405 497 H493 V615 H588" fill="none" stroke="#52636b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M595 641 H464 V517 H412" fill="none" stroke="#52636b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="500" y="681" font-size="14" font-weight="normal" class="muted" text-anchor="middle">Solid blocks: prototype data and team-developed interaction components</text></svg>