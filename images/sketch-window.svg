<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Change-specific floating window</title><desc id="desc">Illustrative interface sketch for reviewing a Pending-view repair in a To-do List project. This is not a participant screenshot or a working application.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52636b" stroke-width="1.5"/></marker></defs><rect width="1000" height="440" rx="12" fill="#f8fafb"/><style>text{font-family:Arial,sans-serif;fill:#233039}.mono{font-family:Consolas,monospace}.muted{fill:#5b6870}</style><rect x="25" y="25" width="950" height="390" rx="8" fill="#fff" stroke="#c6d0d5" stroke-width="1.5"/><path d="M33 25 H967 Q975 25 975 33 V76 H25 V33 Q25 25 33 25" fill="#26323a"/><text x="48" y="57" font-family="Arial" font-size="19" font-weight="bold" fill="#fff" style="fill:#fff">AITrace · Review Pending-view repair</text><text x="52" y="109" font-size="16" font-weight="bold" class="" text-anchor="start">todo.js — proposed code</text><text x="58" y="155" font-size="15" font-weight="normal" class="muted" text-anchor="start">1</text><text x="87" y="155" font-size="17" font-weight="normal" class="mono" text-anchor="start">function renderPending(todos) {</text><text x="58" y="184" font-size="15" font-weight="normal" class="muted" text-anchor="start">2</text><text x="87" y="184" font-size="17" font-weight="normal" class="mono" text-anchor="start">  const pending = todos.filter(</text><rect x="49" y="194" width="870" height="28" fill="#e3f0e9"/><text x="58" y="213" font-size="15" font-weight="normal" class="muted" text-anchor="start">3</text><text x="87" y="213" font-size="17" font-weight="normal" class="mono" text-anchor="start">    todo =&gt; !todo.completed</text><text x="58" y="242" font-size="15" font-weight="normal" class="muted" text-anchor="start">4</text><text x="87" y="242" font-size="17" font-weight="normal" class="mono" text-anchor="start">  );</text><text x="58" y="271" font-size="15" font-weight="normal" class="muted" text-anchor="start">5</text><text x="87" y="271" font-size="17" font-weight="normal" class="mono" text-anchor="start">  showTasks(pending);</text><rect x="49" y="281" width="870" height="28" fill="#e3f0e9"/><text x="58" y="300" font-size="15" font-weight="normal" class="muted" text-anchor="start">6</text><text x="87" y="300" font-size="17" font-weight="normal" class="mono" text-anchor="start">  showCount(pending.length);</text><text x="58" y="329" font-size="15" font-weight="normal" class="muted" text-anchor="start">7</text><text x="87" y="329" font-size="17" font-weight="normal" class="mono" text-anchor="start">}</text><text x="52" y="390" font-size="14" font-weight="normal" class="muted" text-anchor="start">Prepared example · Boolean completion field · Illustrative sketch</text><rect x="25" y="76" width="950" height="294" fill="#233039" opacity="0.14"/><rect x="270" y="117" width="470" height="225" rx="8" fill="#fff" stroke="#71868e" stroke-width="1.5"/><text x="294" y="151" font-size="21" font-weight="bold" class="" text-anchor="start">Understand this repair</text><text x="294" y="189" font-size="17" font-weight="normal" class="" text-anchor="start">The filter keeps incomplete tasks.</text><text x="294" y="216" font-size="17" font-weight="normal" class="" text-anchor="start">The counter uses the same filtered list.</text><text x="294" y="251" font-size="17" font-weight="normal" class="" text-anchor="start">▸ Explanation and checks</text><rect x="294" y="280" width="195" height="36" rx="8" fill="#e3f0e9" stroke="#c6d0d5" stroke-width="1.5"/><text x="391" y="304" font-size="15" font-weight="bold" class="" text-anchor="middle">Accept linked edits</text><rect x="505" y="280" width="210" height="36" rx="8" fill="#fff" stroke="#c6d0d5" stroke-width="1.5"/><text x="610" y="304" font-size="15" font-weight="normal" class="" text-anchor="middle">Back to code</text></svg>